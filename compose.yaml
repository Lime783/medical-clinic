name: medical-clinic
services:
  postgres:
    image: postgres:16
    container_name: medical-clinic-db
    environment:
      POSTGRES_DB: medical-clinic
      POSTGRES_USER: medical-clinic
      POSTGRES_PASSWORD: medical-clinic
    ports:
      - "5433:5432"

    volumes:
      - medical-clinic-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical-clinic -d medical-clinic"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  medical-clinic-data:
