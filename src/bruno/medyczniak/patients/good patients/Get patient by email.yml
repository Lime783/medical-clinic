info:
  name: Get patient by email
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/patients?email=anna.nowak@example.com"
  params:
    - name: email
      value: anna.nowak@example.com
      type: query
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
