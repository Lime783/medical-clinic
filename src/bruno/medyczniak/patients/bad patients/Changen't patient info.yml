info:
  name: Changen't patient info
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/patients/anna.nowak@example.com"
  body:
    type: json
    data: |-
      {
        "email": "to-nie-jest-email",
        "password": "krotkie",
        "idCardNo": "XYZ",
        "firstName": "",
        "lastName": "Lis",
        "phoneNumber": "500",
        "birthday": "2044-02-20"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
