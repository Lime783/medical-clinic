info:
  name: Addn't patient
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/patients?res.status=400"
  params:
    - name: res.status
      value: "400"
      type: query
  body:
    type: json
    data: |
      {
        "email": "to-nie-jest-email",
        "password": "krotkie",
        "idCardNo": "XYZ",
        "firstName": "",
        "lastName": "Lis",
        "phoneNumber": "500",
        "birthday": "2044-02-20"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
