info:
  name: Change password of patient
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{baseUrl}}/patients/anna.nowak@example.com/new-password"
  body:
    type: json
    data: |-
      {
        "new-password": "Nowe#Haslo2026"
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
